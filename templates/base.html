<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace-Eye Demo - APT 威胁检测系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Trace-Eye</h1>
                <p class="subtitle">APT 威胁检测</p>
            </div>

            <nav class="sidebar-nav">
                <a href="#page-upload" class="nav-item active" data-page="upload">
                    <span class="nav-icon">📁</span>
                    <span class="nav-text">数据准备</span>
                    <span class="nav-status" id="navStatusUpload"></span>
                </a>
                <a href="#page-extract" class="nav-item" data-page="extract">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">事件提取</span>
                    <span class="nav-status" id="navStatusExtract"></span>
                </a>
                <a href="#page-graph" class="nav-item" data-page="graph">
                    <span class="nav-icon">🕸️</span>
                    <span class="nav-text">关系图构建</span>
                    <span class="nav-status" id="navStatusGraph"></span>
                </a>
                <a href="#page-rules" class="nav-item" data-page="rules">
                    <span class="nav-icon">🔍</span>
                    <span class="nav-text">规则检测</span>
                    <span class="nav-status" id="navStatusRules"></span>
                </a>
                <a href="#page-threat" class="nav-item" data-page="threat">
                    <span class="nav-icon">⚠️</span>
                    <span class="nav-text">威胁检测</span>
                    <span class="nav-status" id="navStatusThreat"></span>
                </a>
                <a href="#page-relations" class="nav-item" data-page="relations">
                    <span class="nav-icon">🔗</span>
                    <span class="nav-text">关系挖掘</span>
                    <span class="nav-status" id="navStatusRelations"></span>
                </a>
                <a href="#page-chains" class="nav-item" data-page="chains">
                    <span class="nav-icon">⛓️</span>
                    <span class="nav-text">攻击链重建</span>
                    <span class="nav-status" id="navStatusChains"></span>
                </a>
                <a href="#page-ai" class="nav-item" data-page="ai">
                    <span class="nav-icon">🤖</span>
                    <span class="nav-text">AI 分析</span>
                    <span class="nav-status" id="navStatusAi"></span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="btnReset" class="btn-reset">🔄 重置系统</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部状态栏 -->
            <header class="top-bar">
                <div class="top-bar-info">
                    <span id="currentStepName">数据准备</span>
                    <span class="top-bar-divider">|</span>
                    <span id="systemStatus">系统状态: 就绪</span>
                </div>
                <div class="top-bar-stats">
                    <span class="stat-badge">事件: <b id="statTotalEvents">-</b></span>
                    <span class="stat-badge">告警: <b id="statAlerts">-</b></span>
                    <span class="stat-badge">威胁: <b id="statThreatLevel">-</b></span>
                </div>
            </header>

            <!-- 页面内容容器 -->
            <div class="page-container">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- 全局模态框 -->
    {% include 'components/modals.html' %}

    <!-- 脚本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="/static/js/utils/common.js"></script>
    <script src="/static/js/utils/api.js"></script>
    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
